name: Build & Release Windows Executable (.exe)

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Native Windows Flutter .exe
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Obter Versao do Projeto
        id: version
        shell: powershell
        run: |
          $content = Get-Content pubspec.yaml -Raw
          if ($content -match 'version:\s*([0-9.]+)') {
            $ver = $matches[1]
          } else {
            $ver = "2.0.8"
          }
          Write-Output "val=$ver" >> $env:GITHUB_OUTPUT

      - name: Configurar Plataforma Windows
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --project-name=binfae_desktop
          flutter pub get

      - name: Verificar Código Dart (Flutter Analyze)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $out = flutter analyze lib --no-fatal-infos --no-fatal-warnings 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $errLines = $out | Where-Object { $_ -match '^\s*error\s+' }
            $count = 0
            foreach ($line in $errLines) {
              if ($count -lt 8) {
                $clean = ($line.ToString() -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
                Write-Host "::error::$clean"
                $count++
              }
            }
            if ($errLines.Count -gt 8) {
              $rest = ($errLines | Select-Object -Skip 8 | ForEach-Object { $_.ToString().Trim() }) -join " | "
              if ($rest.Length -gt 3500) { $rest = $rest.Substring(0, 3500) }
              Write-Host "::error::MORE ERRORS ($($errLines.Count - 8)): $rest"
            } elseif ($errLines.Count -eq 0) {
              $tail = ($out | Select-Object -Last 15) -join " | "
              Write-Host "::error::ANALYZE FAILED: $tail"
            }
            exit $code
          }

      - name: Compilar Release Nativo Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $out = flutter build windows --release --dart-define=APP_VERSION=v${{ steps.version.outputs.val }} 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $errLines = $out | Where-Object { $_ -match 'Error:|error C|error LNK|Exception|lib/' }
            $summary = ($errLines | Select-Object -First 25 | ForEach-Object { $_.ToString().Trim() }) -join " | "
            if (-not $summary) {
              $summary = ($out | Select-Object -Last 20 | ForEach-Object { $_.ToString().Trim() }) -join " | "
            }
            if ($summary.Length -gt 3500) { $summary = $summary.Substring(0, 3500) }
            Write-Host "::error::BUILD FAILED: $summary"
            exit $code
          }

      - name: Criar Pacote Portátil ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\BinfaeDesktop-Portable-x64.zip

      - name: Compilar Instalador Oficial (.exe) com Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ steps.version.outputs.val }}" inno-setup.iss

      - name: Enviar Artefatos de Build
        uses: actions/upload-artifact@v4
        with:
          name: BinfaeDesktop-Windows-Release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release no GitHub com Download do .exe
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        with:
          tag_name: latest
          name: "Informatica - BINFAE-GL v${{ steps.version.outputs.val }} - Aplicativo Nativo Windows (.exe)"
          body: |
            ## Informatica - BINFAE-GL v${{ steps.version.outputs.val }} - Versão Oficial Nativa Desktop 💻
            
            Aplicativo oficial 100% nativo desenvolvido em **Flutter Desktop (C++/DirectX)** com nova interface moderna v2.0, tema escuro profundo e acentos vibrantes de roxo e verde.
            
            ### 📥 Opções de Download:
            - **[BinfaeDesktop-Setup.exe](https://github.com/LucasFerreira198/BinfaeDesktopApp/releases/download/latest/BinfaeDesktop-Setup.exe)**: Instalador automático que cria atalhos no Desktop e Menu Iniciar com suporte a atualização direta no app.
            - **[BinfaeDesktop-Portable-x64.zip](https://github.com/LucasFerreira198/BinfaeDesktopApp/releases/download/latest/BinfaeDesktop-Portable-x64.zip)**: Versão portátil (basta descompactar e executar).
            
            ### 🚀 Novidades da Versão ${{ steps.version.outputs.val }}:
            - 🛰️ **Novo Design Tático Aerospace Command**: Redesign completo de todas as 14 telas do sistema alinhadas ao padrão de interface tática aeroespacial Google Stitch.
            - 📊 **Auditoria de Movimentações Reais no Dashboard**: Removidos dados fictícios/mockados; histórico sincronizado em tempo real com BMPs, descrições e militares reais.
            - 🏷️ **Grid Tático de Estoque com Status e Ações Rápidas**: Identificação precisa de materiais em setor, cautela fixa, missão e manutenção, com botões dedicados de Despacho para Manutenção, Histórico e QR Code / Etiqueta patrimonial.
            - 📅 **Escala de Sobreaviso Mensal Resiliente**: Prevenção de quebras por parsing de data e geração dinâmica de template tático para rápida atribuição e homologação.
            - 👥 **Painel Administrativo com Filtros Avançados**: Barra de pesquisa para militares e usuários por nome de guerra, SARAM e posto, normalização inteligente de graduações (Major/Capitão) e seletor rápido para Chefia de TI.
            - 👤 **Foto de Perfil com Renderização Contínua**: Eliminação de cintilação e reload de imagem com clock tático desacoplado.
            - 🔄 **Auto-Atualizador Tático Aperfeiçoado**: Detecção precisa de novas versões com cabeçalho User-Agent oficial e botão de verificação manual nas configurações.
          files: |
            dist/BinfaeDesktop-Setup.exe
            dist/BinfaeDesktop-Portable-x64.zip
          prerelease: false
          overwrite_files: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
