name: Build & Release Windows Executable (.exe)

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Native Windows Flutter .exe
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configurar Plataforma Windows
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --project-name=binfae_desktop
          flutter pub get

      - name: Compilar Release Nativo Windows
        run: flutter build windows --release

      - name: Criar Pacote Portátil ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\BinfaeDesktop-Portable-x64.zip

      - name: Compilar Instalador Oficial (.exe) com Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" inno-setup.iss

      - name: Enviar Artefatos de Build
        uses: actions/upload-artifact@v4
        with:
          name: BinfaeDesktop-Windows-Release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release no GitHub com Download do .exe
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        with:
          tag_name: latest
          name: "Binfae Desktop - Aplicativo Nativo Windows (.exe)"
          body: |
            ## BINFAE Desktop - Versão Oficial para Computadores Windows 💻
            
            Aplicativo 100% nativo desenvolvido em **Flutter Desktop (C++/DirectX)** para máxima performance e fluidez, sem Electron.
            
            ### 📥 Opções de Download:
            - **[BinfaeDesktop-Setup.exe](https://github.com/LucasFerreira198/BinfaeDesktopApp/releases/download/latest/BinfaeDesktop-Setup.exe)**: Instalador automático que cria atalhos no Desktop e Menu Iniciar.
            - **[BinfaeDesktop-Portable-x64.zip](https://github.com/LucasFerreira198/BinfaeDesktopApp/releases/download/latest/BinfaeDesktop-Portable-x64.zip)**: Versão portátil (basta descompactar e executar).
            
            ### 🚀 Destaques:
            - ⚡ **Banco Local de 0ms**: Busca instantânea de materiais e cautelas.
            - 🌓 **Modo Escuro / Claro**: Interface adaptativa de alta densidade.
            - 🏷️ **QR Code Patrimonial**: Visualização e impressão de etiquetas.
            - 🔄 **Sincronização em Tempo Real**: Conexão automática com a API de produção.
          files: |
            dist/BinfaeDesktop-Setup.exe
            dist/BinfaeDesktop-Portable-x64.zip
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
