name: Build & Release Windows Executable (.exe)

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Native Windows Flutter .exe
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configurar Plataforma Windows
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --project-name=binfae_desktop
          flutter pub get

      - name: Compilar Release Nativo Windows
        run: flutter build windows --release

      - name: Criar Pacote Portátil ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\BinfaeDesktop-Portable-x64.zip

      - name: Compilar Instalador Oficial (.exe) com Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" inno-setup.iss

      - name: Enviar Artefatos de Build
        uses: actions/upload-artifact@v4
        with:
          name: BinfaeDesktop-Windows-Release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Obter Versao do Projeto
        id: version
        shell: powershell
        run: |
          $content = Get-Content pubspec.yaml -Raw
          if ($content -match 'version:\s*([0-9.]+)') {
            $ver = $matches[1]
          } else {
            $ver = "2.0.6"
          }
          Write-Output "val=$ver" >> $env:GITHUB_OUTPUT

      - name: Publicar Release no GitHub com Download do .exe
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        with:
          tag_name: latest
          name: "Informatica - BINFAE-GL v${{ steps.version.outputs.val }} - Aplicativo Nativo Windows (.exe)"
          body: |
            ## Informatica - BINFAE-GL v${{ steps.version.outputs.val }} - Versão Oficial Nativa Desktop 💻
            
            Aplicativo oficial 100% nativo desenvolvido em **Flutter Desktop (C++/DirectX)** com nova interface moderna v2.0, tema escuro profundo e acentos vibrantes de roxo e verde.
            
            ### 📥 Opções de Download:
            - **[BinfaeDesktop-Setup.exe](https://github.com/LucasFerreira198/BinfaeDesktopApp/releases/download/latest/BinfaeDesktop-Setup.exe)**: Instalador automático que cria atalhos no Desktop e Menu Iniciar com suporte a atualização direta no app.
            - **[BinfaeDesktop-Portable-x64.zip](https://github.com/LucasFerreira198/BinfaeDesktopApp/releases/download/latest/BinfaeDesktop-Portable-x64.zip)**: Versão portátil (basta descompactar e executar).
            
            ### 🚀 Novidades da Versão ${{ steps.version.outputs.val }}:
            - 🎯 **Correção e Aprimoramento do Módulo de Cautelas**: Exibição precisa do status "Em Uso" para itens ativos, sem marcar falsamente como devolvido.
            - 🔄 **Menu de Opções de Devolução**: Descautelação manual ou por scanner/leitor USB direcionado exclusivamente para o material selecionado, com bloqueio estrito de códigos de outros itens.
            - 👤 **Identificação Completa do Militar Responsável**: SARAM, posto, nome de guerra e telefone de contato visíveis nos detalhes da missão.
            - ⏱️ **Estabilidade de Conexão com Servidor**: Timeout de integridade expandido para 12 segundos, absorvendo a inicialização do backend.
            - 🔒 **Sessão Estrita de 24 Horas & Cache Seguro**: Prevenção de logout acidental ao fechar e reabrir a janela, com expiração rigorosa em 24h e suporte a refresh token silencioso.
            - 🔍 **Seletor de Militares com Busca em Tempo Real**: Na criação de novos usuários, pesquisa ágil por nome de guerra, nome completo, SARAM ou seção.
            - 🏢 **Gravação e Persistência de Seção do Militar**: Suporte integrado no cadastro e edição do efetivo militar, com persistência no banco de dados e backend.
            - 🎖️ **Padronização dos Postos S2 e S1**: Graduações normalizadas de Soldado de 2ª e 1ª Classe em todo o sistema.
          files: |
            dist/BinfaeDesktop-Setup.exe
            dist/BinfaeDesktop-Portable-x64.zip
          prerelease: false
          overwrite_files: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

